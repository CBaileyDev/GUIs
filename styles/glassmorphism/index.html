<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Glassmorphism Menu</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { color-scheme: dark; }
    body {
      font-family: 'Inter', sans-serif;
      min-height: 100dvh;
      padding: 40px 20px;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      background:
        radial-gradient(ellipse at 20% 50%, #7b2ff7 0%, transparent 50%),
        radial-gradient(ellipse at 80% 20%, #00c6fb 0%, transparent 45%),
        radial-gradient(ellipse at 60% 80%, #f857a6 0%, transparent 45%),
        linear-gradient(135deg, #0d0d1a 0%, #1a0a2e 100%);
      accent-color: #a78bfa;
    }
    body::before, body::after {
      content: '';
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.35;
      pointer-events: none;
    }
    body::before { width: 420px; height: 420px; background: #7b2ff7; top: -100px; left: -100px; }
    body::after  { width: 380px; height: 380px; background: #00c6fb; bottom: -80px; right: -80px; }

    .card {
      width: 420px;
      padding: 36px 32px;
      border-radius: 24px;
      background: rgba(255,255,255,0.08);
      backdrop-filter: blur(20px) saturate(160%);
      -webkit-backdrop-filter: blur(20px) saturate(160%);
      border: 1px solid rgba(255,255,255,0.18);
      box-shadow: 0 8px 32px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.2);
      position: relative;
      z-index: 1;
    }

    .eyebrow {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: rgba(255,255,255,0.5);
      margin-bottom: 8px;
      text-align: center;
    }
    h1 {
      font-size: 26px;
      font-weight: 700;
      color: #fff;
      line-height: 1.2;
      text-align: center;
      margin-bottom: 6px;
    }
    .sub {
      font-size: 13px;
      color: rgba(255,255,255,0.55);
      text-align: center;
      margin-bottom: 28px;
    }

    .section-title {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: rgba(255,255,255,0.45);
      margin-bottom: 14px;
      padding-bottom: 6px;
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }

    .btn-row { display: flex; gap: 12px; margin-bottom: 22px; }
    .btn {
      flex: 1;
      padding: 11px 16px;
      border-radius: 12px;
      border: none;
      font-family: inherit;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s, box-shadow 0.15s;
    }
    .btn-primary {
      background: linear-gradient(135deg, #a78bfa, #60c8f8);
      color: #fff;
      box-shadow: 0 4px 16px rgba(167,139,250,0.4);
    }
    .btn-primary:hover { opacity: 0.9; }
    .btn-secondary {
      background: rgba(255,255,255,0.1);
      color: rgba(255,255,255,0.85);
      border: 1px solid rgba(255,255,255,0.18);
    }
    .btn-secondary:hover { background: rgba(255,255,255,0.16); }

    .form-group { margin-bottom: 20px; }
    .form-label {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      font-weight: 500;
      color: rgba(255,255,255,0.75);
      margin-bottom: 8px;
    }
    .form-label .value { color: #a78bfa; font-variant-numeric: tabular-nums; }

    input[type="range"] {
      -webkit-appearance: none;
      width: 100%;
      height: 4px;
      border-radius: 2px;
      background: rgba(255,255,255,0.15);
      outline: none;
      cursor: pointer;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #fff;
      border: 2px solid #a78bfa;
      box-shadow: 0 0 8px rgba(167,139,250,0.5);
    }

    .checkbox-row {
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      padding: 10px 0;
      margin-bottom: 18px;
      color: rgba(255,255,255,0.85);
    }
    .checkbox-row input {
      position: absolute;
      opacity: 0;
      width: 1px;
      height: 1px;
    }
    .chk {
      width: 18px;
      height: 18px;
      border-radius: 6px;
      border: 1.5px solid rgba(255,255,255,0.3);
      background: rgba(255,255,255,0.06);
      position: relative;
      flex-shrink: 0;
    }
    input[type="checkbox"]:focus-visible ~ .chk {
      outline: 2px solid #a78bfa;
      outline-offset: 2px;
    }
    input[type="checkbox"]:checked ~ .chk {
      background: linear-gradient(135deg, #a78bfa, #60c8f8);
      border-color: transparent;
    }
    input[type="checkbox"]:checked ~ .chk::after {
      content: '';
      position: absolute;
      left: 5px;
      top: 2px;
      width: 5px;
      height: 9px;
      border: solid #fff;
      border-width: 0 2px 2px 0;
      transform: rotate(45deg);
    }

    select, input[type="text"] {
      width: 100%;
      padding: 10px 12px;
      font-family: inherit;
      font-size: 14px;
      color: #fff;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 10px;
      outline: none;
    }
    select option { background: #1a0a2e; color: #fff; }
    select:focus, input[type="text"]:focus { border-color: rgba(167,139,250,0.6); }
    input[type="text"]::placeholder { color: rgba(255,255,255,0.35); }

    .output {
      margin-top: 20px;
      padding: 12px 14px;
      border-radius: 10px;
      background: rgba(0,0,0,0.25);
      border: 1px solid rgba(255,255,255,0.08);
      font-size: 12px;
      color: rgba(255,255,255,0.55);
      min-height: 40px;
    }
    .output strong { color: #a78bfa; }

    :focus-visible { outline: 2px solid #a78bfa; outline-offset: 2px; border-radius: 6px; }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition-duration: 0.001ms !important; }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="eyebrow">Frosted panel</div>
    <h1>Glassmorphism</h1>
    <div class="sub">Translucent surfaces over a vivid backdrop</div>

    <div class="section-title">Actions</div>
    <div class="btn-row">
      <button class="btn btn-primary" id="apply">Apply</button>
      <button class="btn btn-secondary" id="reset">Reset</button>
    </div>

    <div class="form-group">
      <label class="form-label" for="opacity">Opacity <span class="value" id="v">72%</span></label>
      <input type="range" id="opacity" min="0" max="100" value="72">
    </div>

    <label class="checkbox-row">
      <input type="checkbox" id="blur">
      <span class="chk"></span>
      <span>Backdrop blur</span>
    </label>

    <div class="form-group">
      <label class="form-label" for="tint">Tint</label>
      <select id="tint">
        <option>Aurora Violet</option>
        <option>Ocean Cyan</option>
        <option>Sunset Rose</option>
        <option>Emerald Mist</option>
      </select>
    </div>

    <div class="form-group">
      <input type="text" id="title" placeholder="Panel title…" aria-label="Panel title">
    </div>

    <div class="output" id="out" role="status" aria-live="polite"><strong id="out-msg">Ready</strong><span id="out-detail"> — adjust the panel</span></div>
  </div>
  <script>
    (function () {
      const msg = document.getElementById('out-msg');
      const detail = document.getElementById('out-detail');
      const log = (m) => {
        msg.textContent = m;
        detail.textContent = '';
      };

      document.getElementById('apply').addEventListener('click', () => log('Apply'));
      document.getElementById('reset').addEventListener('click', () => log('Reset'));

      const opacity = document.getElementById('opacity');
      const opacityValue = document.getElementById('v');
      opacity.addEventListener('input', () => {
        opacityValue.textContent = `${opacity.value}%`;
        log(`Opacity ${opacity.value}%`);
      });

      document.getElementById('blur').addEventListener('change', (e) => log(`Backdrop blur ${e.target.checked}`));
      document.getElementById('tint').addEventListener('change', (e) => log(`Tint ${e.target.value}`));
      document.getElementById('title').addEventListener('input', (e) => log(`Title ${e.target.value}`));
    })();
  </script>
</body>
</html>
