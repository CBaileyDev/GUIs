<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dracula Theme Menu</title>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #282a36; --cur: #44475a; --fg: #f8f8f2; --com: #6272a4;
      --cyan: #8be9fd; --green: #50fa7b; --orange: #ffb86c;
      --pink: #ff79c6; --purple: #bd93f9; --red: #ff5555; --yellow: #f1fa8c;
    }
    html { color-scheme: dark; }
    body {
      font-family: 'Inter', sans-serif;
      min-height: 100dvh;
      padding: 40px 20px;
      display: flex; align-items: flex-start; justify-content: center;
      background:
        radial-gradient(900px 500px at 20% 0%, rgba(189,147,249,0.12), transparent 60%),
        radial-gradient(700px 400px at 100% 100%, rgba(139,233,253,0.08), transparent 60%),
        var(--bg);
      color: var(--fg);
      accent-color: var(--purple);
    }
    .card {
      width: 420px; padding: 32px;
      background: linear-gradient(180deg, #2a2c39 0%, #282a36 100%);
      border: 1px solid var(--cur);
      border-radius: 10px;
      box-shadow: 0 12px 40px rgba(0,0,0,0.55);
    }
    .eyebrow {
      font-family: 'Fira Code', monospace;
      font-size: 11px; color: var(--pink); margin-bottom: 8px;
    }
    h1 {
      font-size: 28px; font-weight: 700;
      background: linear-gradient(90deg, var(--purple), var(--pink), var(--cyan));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    }
    .sub { font-size: 13px; color: var(--com); margin-top: 4px; margin-bottom: 24px; }

    .section-title {
      font-family: 'Fira Code', monospace; font-size: 11px;
      color: var(--cyan); text-transform: uppercase; letter-spacing: 2px;
      margin-bottom: 12px;
    }
    .section-title::before { content: '// '; color: var(--com); }

    .btn-row { display: flex; gap: 12px; margin-bottom: 22px; }
    .btn {
      flex: 1; padding: 11px; font-family: inherit;
      font-size: 14px; font-weight: 600;
      border-radius: 6px; cursor: pointer; border: none;
      transition: opacity 0.15s, transform 0.1s, box-shadow 0.15s;
    }
    .btn-primary {
      background: linear-gradient(135deg, var(--pink), var(--purple));
      color: var(--bg);
      box-shadow: 0 4px 14px rgba(255,121,198,0.35);
    }
    .btn-primary:hover { box-shadow: 0 6px 18px rgba(255,121,198,0.5); }
    .btn-secondary {
      background: var(--cur); color: var(--fg); border: 1px solid var(--com);
    }
    .btn-secondary:hover { background: #4e5166; }
    .btn:active { transform: translateY(1px); }

    .form-group { margin-bottom: 20px; }
    .form-label {
      display: flex; justify-content: space-between;
      font-size: 13px; margin-bottom: 8px; font-weight: 500;
    }
    .form-label .value {
      font-family: 'Fira Code', monospace; color: var(--green);
      background: var(--cur); padding: 1px 8px; border-radius: 4px; font-size: 12px;
    }

    input[type="range"] {
      -webkit-appearance: none; width: 100%; height: 4px;
      background: var(--cur); border-radius: 2px; outline: none; cursor: pointer;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none; width: 16px; height: 16px; border-radius: 50%;
      background: var(--pink); border: 2px solid var(--bg);
      box-shadow: 0 0 8px rgba(255,121,198,0.4);
    }

    .checkbox-row {
      display: flex; align-items: center; gap: 12px; cursor: pointer;
      padding: 10px 12px; border-radius: 6px; background: var(--cur);
      margin-bottom: 18px;
      transition: background 0.15s;
    }
    .checkbox-row:hover { background: #4e5166; }
    .checkbox-row input { position: absolute; opacity: 0; width: 1px; height: 1px; }
    .chk {
      width: 18px; height: 18px; border-radius: 4px;
      border: 1.5px solid var(--com); background: var(--bg);
      position: relative; flex-shrink: 0;
    }
    input[type="checkbox"]:focus-visible ~ .chk { outline: 2px solid var(--purple); outline-offset: 2px; }
    input[type="checkbox"]:checked ~ .chk { background: var(--purple); border-color: var(--purple); }
    input[type="checkbox"]:checked ~ .chk::after {
      content: ''; position: absolute; left: 5px; top: 1px;
      width: 5px; height: 10px; border: solid var(--bg);
      border-width: 0 2px 2px 0; transform: rotate(45deg);
    }
    .chk-label { font-size: 14px; }

    select, input[type="text"] {
      width: 100%; padding: 10px 12px;
      font-family: inherit; font-size: 14px;
      color: var(--fg); background: var(--bg);
      border: 1px solid var(--cur); border-radius: 6px; outline: none;
    }
    select option { background: var(--bg); }
    select:focus, input[type="text"]:focus { border-color: var(--purple); box-shadow: 0 0 0 3px rgba(189,147,249,0.2); }
    input[type="text"]::placeholder { color: var(--com); }

    .output {
      margin-top: 20px; padding: 12px 14px;
      background: var(--bg); border: 1px solid var(--cur); border-radius: 6px;
      font-family: 'Fira Code', monospace; font-size: 12px;
      color: var(--com); min-height: 40px;
    }
    .output strong { color: var(--green); }
    .output em { color: var(--yellow); font-style: normal; }

    :focus-visible { outline: 2px solid var(--purple); outline-offset: 2px; border-radius: 6px; }
    ::selection { background: color-mix(in srgb, var(--purple) 30%, transparent); color: inherit; }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.001ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.001ms !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="eyebrow">Dracula theme</div>
    <h1>Dracula</h1>
    <div class="sub">A dark theme for 300+ apps</div>

    <div class="section-title">actions</div>
    <div class="btn-row">
      <button class="btn btn-primary" id="apply">Apply</button>
      <button class="btn btn-secondary" id="reset">Reset</button>
    </div>

    <div class="form-group">
      <label class="form-label" for="saturation">Saturation <span class="value" id="v">80</span></label>
      <input type="range" id="saturation" min="0" max="100" value="80">
    </div>

    <label class="checkbox-row">
      <input type="checkbox" id="ligatures">
      <span class="chk"></span>
      <span class="chk-label">Font ligatures</span>
    </label>

    <div class="form-group">
      <label class="form-label" for="accent">Accent color</label>
      <select id="accent">
        <option>Pink</option><option>Purple</option>
        <option>Cyan</option><option>Green</option>
      </select>
    </div>

    <div class="form-group">
      <input type="text" id="search" placeholder="Search theme..." aria-label="Search theme">
    </div>

    <div class="output" id="out" role="status" aria-live="polite"><strong id="out-msg">ready</strong><span id="out-detail"> <em>v2.0</em></span></div>
  </div>
  <script>
    (function () {
      const msg = document.getElementById('out-msg');
      const detail = document.getElementById('out-detail');
      const log = (m) => {
        msg.textContent = 'ok';
        detail.textContent = ` ${m}`;
      };

      document.getElementById('apply').addEventListener('click', () => log('Apply'));
      document.getElementById('reset').addEventListener('click', () => log('Reset'));

      const saturation = document.getElementById('saturation');
      const saturationValue = document.getElementById('v');
      saturation.addEventListener('input', () => {
        saturationValue.textContent = saturation.value;
        log(`Saturation ${saturation.value}`);
      });

      document.getElementById('ligatures').addEventListener('change', (e) => log(`Ligatures ${e.target.checked}`));
      document.getElementById('accent').addEventListener('change', (e) => log(`Accent ${e.target.value}`));
      document.getElementById('search').addEventListener('input', (e) => log(`Search ${e.target.value}`));
    })();
  </script>
</body>
</html>
