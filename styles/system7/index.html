<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>System 7 Menu</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { color-scheme: light; }
    body {
      font-family: Charcoal, Chicago, Geneva, "Helvetica Neue", sans-serif;
      font-size: 13px;
      min-height: 100dvh;
      padding: 40px 20px;
      display: flex; align-items: flex-start; justify-content: center;
      background: repeating-conic-gradient(#7d7d7d 0% 25%, #989898 0% 50%);
      background-size: 4px 4px;
      color: #000000;
      accent-color: #000000;
    }
    :focus-visible { outline: 2px solid #000000; outline-offset: 2px; }
    ::selection { background: #000000; color: #ffffff; }

    .window {
      width: 440px; background: #ffffff;
      border: 1px solid #000000;
      box-shadow: 2px 2px 0 #000000;
    }

    .title-bar {
      display: flex; align-items: center; gap: 6px;
      height: 19px; padding: 0 6px;
      background: #ffffff; border-bottom: 1px solid #000000;
    }
    .close-box {
      width: 11px; height: 11px; flex-shrink: 0;
      border: 1px solid #000000; background: #ffffff;
      position: relative; cursor: pointer;
    }
    .close-box::after { content: ""; position: absolute; inset: 2px; border: 1px solid #000000; }
    .stripes {
      flex: 1; height: 11px;
      background: repeating-linear-gradient(to bottom, #000000 0, #000000 1px, #ffffff 1px, #ffffff 2px);
    }
    .title-text { padding: 0 4px; white-space: nowrap; }

    .content { padding: 16px 18px 0; }

    h1 { font-size: 15px; font-weight: 400; margin-bottom: 2px; }
    .sub { font-family: Geneva, "Helvetica Neue", sans-serif; font-size: 11px; margin-bottom: 16px; }

    .field { margin-bottom: 16px; }
    .field-label {
      display: flex; justify-content: space-between; align-items: baseline;
      font-size: 12px; margin-bottom: 6px;
    }

    input[type="range"] {
      -webkit-appearance: none; appearance: none;
      width: 100%; height: 18px; background: transparent; cursor: pointer;
    }
    input[type="range"]::-webkit-slider-runnable-track {
      height: 8px; background: #ffffff; border: 1px solid #000000;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none; appearance: none;
      width: 12px; height: 16px; margin-top: -4px;
      background: #ffffff; border: 1px solid #000000;
      box-shadow: 1px 1px 0 #000000;
    }
    input[type="range"]::-moz-range-track {
      height: 8px; background: #ffffff; border: 1px solid #000000;
    }
    input[type="range"]::-moz-range-thumb {
      width: 12px; height: 16px;
      background: #ffffff; border: 1px solid #000000; border-radius: 0;
      box-shadow: 1px 1px 0 #000000;
    }

    .check {
      display: flex; align-items: center; gap: 8px;
      cursor: pointer; margin-bottom: 16px; position: relative;
    }
    .check input { position: absolute; opacity: 0; width: 1px; height: 1px; }
    .box {
      width: 12px; height: 12px; flex-shrink: 0;
      border: 1px solid #000000; background: #ffffff; position: relative;
    }
    .check input:checked ~ .box::before,
    .check input:checked ~ .box::after {
      content: ""; position: absolute; left: 0; top: 50%;
      width: 100%; height: 1px; background: #000000;
    }
    .check input:checked ~ .box::before { transform: rotate(45deg); }
    .check input:checked ~ .box::after { transform: rotate(-45deg); }
    .check input:focus-visible ~ .box { outline: 2px solid #000000; outline-offset: 2px; }

    .popup { position: relative; }
    .popup::after {
      content: ""; position: absolute; right: 8px; top: 50%; margin-top: -2px;
      border-left: 5px solid transparent; border-right: 5px solid transparent;
      border-top: 6px solid #000000; pointer-events: none;
    }
    select {
      width: 100%; font-family: inherit; font-size: 13px;
      padding: 3px 24px 3px 8px;
      background: #ffffff; color: #000000;
      border: 1px solid #000000; border-radius: 0;
      box-shadow: 1px 1px 0 #000000;
      appearance: none; -webkit-appearance: none; cursor: pointer;
    }

    input[type="text"] {
      width: 100%; font-family: Geneva, "Helvetica Neue", sans-serif; font-size: 12px;
      padding: 4px 6px;
      background: #ffffff; color: #000000;
      border: 1px solid #000000; border-radius: 0;
    }
    input[type="text"]::placeholder { color: #555555; }

    .btn-row { display: flex; justify-content: flex-end; gap: 18px; padding: 6px 4px 16px; }
    .btn {
      font-family: inherit; font-size: 13px; min-width: 70px;
      padding: 4px 18px;
      background: #ffffff; color: #000000;
      border: 1px solid #000000; border-radius: 6px;
      cursor: pointer;
    }
    .btn:active { background: #000000; color: #ffffff; }
    .btn-default { box-shadow: 0 0 0 2px #ffffff, 0 0 0 5px #000000; margin: 5px; }

    .status {
      border-top: 1px solid #000000;
      padding: 5px 10px; margin: 0 -18px;
      font-family: Geneva, "Helvetica Neue", sans-serif; font-size: 11px;
      min-height: 22px;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.001ms !important;
        transition-duration: 0.001ms !important;
      }
    }
  </style>
</head>
<body>
  <div class="window">
    <div class="title-bar">
      <span class="close-box"></span>
      <span class="stripes"></span>
      <span class="title-text">Control Panel</span>
      <span class="stripes"></span>
    </div>

    <div class="content">
      <h1>General Controls</h1>
      <p class="sub">Welcome to Macintosh. System 7.1 &bull; 4 MB of memory.</p>

      <div class="field">
        <div class="field-label">
          <label for="volume">Speaker Volume</label>
          <span id="volume-value">5 of 7</span>
        </div>
        <input type="range" id="volume" min="0" max="7" value="5" />
      </div>

      <label class="check">
        <input type="checkbox" id="flash" checked />
        <span class="box"></span>
        <span>Flash the menu bar when the alert sounds</span>
      </label>

      <div class="field">
        <div class="field-label"><label for="font">System Font</label></div>
        <div class="popup">
          <select id="font">
            <option>Geneva</option>
            <option>Chicago</option>
            <option>Monaco</option>
            <option>New York</option>
          </select>
        </div>
      </div>

      <div class="field">
        <div class="field-label"><label for="macname">Macintosh Name</label></div>
        <input type="text" id="macname" placeholder="Macintosh IIsi" />
      </div>

      <div class="btn-row">
        <button type="button" class="btn" id="btn-cancel">Cancel</button>
        <button type="button" class="btn btn-default" id="btn-ok">OK</button>
      </div>

      <div class="status" id="status" role="status" aria-live="polite">Ready.</div>
    </div>
  </div>

  <script>
    (function () {
      var status = document.getElementById("status");
      function report(message) { status.textContent = message; }

      document.getElementById("btn-ok").addEventListener("click", function () {
        report("Settings saved to the System Folder.");
      });
      document.getElementById("btn-cancel").addEventListener("click", function () {
        report("Changes discarded.");
      });

      var volume = document.getElementById("volume");
      var volumeValue = document.getElementById("volume-value");
      volume.addEventListener("input", function () {
        volumeValue.textContent = volume.value + " of 7";
        report("Speaker volume set to " + volume.value + ".");
      });

      document.getElementById("flash").addEventListener("change", function (event) {
        report(event.target.checked ? "Menu bar will flash on alert." : "Menu bar flash turned off.");
      });

      document.getElementById("font").addEventListener("change", function (event) {
        report("System font changed to " + event.target.value + ".");
      });

      document.getElementById("macname").addEventListener("input", function (event) {
        report("Macintosh name: " + (event.target.value || "(untitled)"));
      });
    })();
  </script>
</body>
</html>
