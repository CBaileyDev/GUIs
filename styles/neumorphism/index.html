<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Neumorphism Menu</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #e0e5ec;
      --shadow-dark: #a3b1c6;
      --shadow-light: #ffffff;
      --accent: #6c63ff;
      --accent-dark: #5147e5;
      --text: #4a5568;
      --text-light: #8896a5;
      --radius: 16px;
    }
    body {
      font-family: 'Nunito', sans-serif;
      min-height: 100vh;
      padding: 40px 20px;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      background: var(--bg);
    }
    .card {
      width: 420px;
      padding: 36px 32px;
      border-radius: 28px;
      background: var(--bg);
      box-shadow: 12px 12px 24px var(--shadow-dark), -12px -12px 24px var(--shadow-light);
    }
    .eyebrow {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--text-light);
      text-align: center;
      margin-bottom: 6px;
    }
    h1 { font-size: 26px; font-weight: 800; color: var(--text); text-align: center; }
    h1 span { color: var(--accent); }
    .sub {
      font-size: 13px;
      color: var(--text-light);
      text-align: center;
      margin: 6px 0 28px;
    }

    .section-title {
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--text-light);
      margin-bottom: 14px;
      padding-bottom: 8px;
      box-shadow: 0 2px 0 var(--shadow-dark);
    }

    .btn-row { display: flex; gap: 12px; margin-bottom: 22px; }
    .btn {
      flex: 1;
      padding: 12px 16px;
      border-radius: var(--radius);
      border: none;
      font-family: inherit;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: box-shadow 0.15s;
    }
    .btn-primary {
      background: linear-gradient(145deg, var(--accent), var(--accent-dark));
      color: #fff;
      box-shadow: 6px 6px 12px var(--shadow-dark), -3px -3px 8px rgba(255,255,255,0.7);
    }
    .btn-primary:active {
      box-shadow: inset 4px 4px 8px rgba(0,0,0,0.2), inset -2px -2px 6px rgba(255,255,255,0.1);
    }
    .btn-secondary {
      background: var(--bg);
      color: var(--text);
      box-shadow: 6px 6px 12px var(--shadow-dark), -6px -6px 12px var(--shadow-light);
    }
    .btn-secondary:active {
      box-shadow: inset 4px 4px 8px var(--shadow-dark), inset -4px -4px 8px var(--shadow-light);
    }

    .form-group { margin-bottom: 20px; }
    .form-label {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 8px;
    }
    .form-label .value { color: var(--accent); font-variant-numeric: tabular-nums; }

    input[type="range"] {
      -webkit-appearance: none;
      width: 100%;
      height: 8px;
      border-radius: 99px;
      background: var(--bg);
      box-shadow: inset 3px 3px 6px var(--shadow-dark), inset -3px -3px 6px var(--shadow-light);
      outline: none;
      cursor: pointer;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: var(--bg);
      box-shadow: 4px 4px 8px var(--shadow-dark), -4px -4px 8px var(--shadow-light);
    }

    .checkbox-row {
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      padding: 12px 14px;
      border-radius: var(--radius);
      background: var(--bg);
      box-shadow: inset 3px 3px 6px var(--shadow-dark), inset -3px -3px 6px var(--shadow-light);
      margin-bottom: 18px;
      color: var(--text);
    }
    .checkbox-row input { display: none; }
    .chk {
      width: 20px;
      height: 20px;
      border-radius: 6px;
      background: var(--bg);
      box-shadow: 3px 3px 6px var(--shadow-dark), -3px -3px 6px var(--shadow-light);
      position: relative;
      flex-shrink: 0;
    }
    input[type="checkbox"]:checked ~ .chk {
      background: var(--accent);
      box-shadow: inset 2px 2px 4px rgba(0,0,0,0.2);
    }
    input[type="checkbox"]:checked ~ .chk::after {
      content: '';
      position: absolute;
      left: 6px;
      top: 3px;
      width: 5px;
      height: 9px;
      border: solid #fff;
      border-width: 0 2px 2px 0;
      transform: rotate(45deg);
    }

    select, input[type="text"] {
      width: 100%;
      padding: 12px 14px;
      font-family: inherit;
      font-size: 14px;
      color: var(--text);
      background: var(--bg);
      border: none;
      border-radius: var(--radius);
      box-shadow: inset 3px 3px 6px var(--shadow-dark), inset -3px -3px 6px var(--shadow-light);
      outline: none;
    }
    select:focus, input[type="text"]:focus { box-shadow: inset 4px 4px 8px var(--shadow-dark), inset -4px -4px 8px var(--shadow-light); }
    input[type="text"]::placeholder { color: var(--text-light); }

    .output {
      margin-top: 20px;
      padding: 12px 14px;
      border-radius: var(--radius);
      background: var(--bg);
      box-shadow: inset 3px 3px 6px var(--shadow-dark), inset -3px -3px 6px var(--shadow-light);
      font-size: 12px;
      color: var(--text-light);
      min-height: 40px;
    }
    .output strong { color: var(--accent); }

    html { color-scheme: light; }
    body { min-height: 100dvh; accent-color: var(--accent); }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="eyebrow">Soft UI</div>
    <h1>Neu<span>morphism</span></h1>
    <div class="sub">Extruded surfaces on a single-tone canvas</div>

    <div class="section-title">Actions</div>
    <div class="btn-row">
      <button class="btn btn-primary" onclick="log('Apply')">Apply</button>
      <button class="btn btn-secondary" onclick="log('Reset')">Reset</button>
    </div>

    <div class="form-group">
      <div class="form-label">Depth <span class="value" id="v">65</span></div>
      <input type="range" min="0" max="100" value="65"
        oninput="document.getElementById('v').textContent=this.value;log('Depth '+this.value)">
    </div>

    <label class="checkbox-row">
      <input type="checkbox" onchange="log('Inset mode '+this.checked)">
      <span class="chk"></span>
      <span>Inset controls</span>
    </label>

    <div class="form-group">
      <div class="form-label">Surface</div>
      <select onchange="log('Surface '+this.value)">
        <option>Cool Grey</option>
        <option>Warm Sand</option>
        <option>Powder Blue</option>
        <option>Lavender</option>
      </select>
    </div>

    <div class="form-group">
      <input type="text" placeholder="Label…" oninput="log('Label '+this.value)">
    </div>

    <div class="output" id="out"><strong>Ready</strong> — tweak the relief</div>
  </div>
  <script>function log(m){document.getElementById('out').innerHTML='<strong>'+m+'</strong>';}</script>
</body>
</html>
