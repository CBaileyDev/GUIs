<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Claymorphism Menu</title>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #eef1fb;
      --clay: #f2f4fe;
      --accent: #8a5cf5;
      --accent-2: #f46ab2;
      --green: #4cd190;
      --orange: #ff9a62;
      --text: #3a3a5c;
      --text-soft: #7b83a6;
      --inner-light: rgba(255,255,255,0.9);
      --inner-dark: rgba(140,145,195,0.35);
    }
    html { color-scheme: light; }
    body {
      font-family: 'Baloo 2', sans-serif;
      min-height: 100dvh;
      padding: 40px 20px;
      display: flex; align-items: flex-start; justify-content: center;
      background:
        radial-gradient(900px 600px at 20% 10%, #e5e2ff 0%, transparent 60%),
        radial-gradient(700px 500px at 90% 90%, #ffd6ee 0%, transparent 55%),
        linear-gradient(135deg, #f1ecff 0%, #fde8f3 100%);
      color: var(--text);
      accent-color: #8a5cf5;
    }
    .card {
      width: 420px; padding: 32px;
      background: var(--clay); border-radius: 36px;
      box-shadow:
        inset 6px 6px 14px var(--inner-light),
        inset -6px -6px 14px var(--inner-dark),
        12px 14px 30px rgba(140,145,195,0.35);
    }
    h1 { font-size: 30px; font-weight: 800; letter-spacing: -0.5px; }
    h1 span {
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    }
    .sub { font-size: 14px; color: var(--text-soft); font-weight: 500; margin-bottom: 20px; }

    .section-title { font-size: 13px; font-weight: 700; color: var(--text-soft); margin-bottom: 10px; }

    .btn-row { display: flex; gap: 14px; margin-bottom: 22px; }
    .btn {
      flex: 1; padding: 14px; border: none;
      font-family: 'Baloo 2', sans-serif; font-size: 15px; font-weight: 700;
      border-radius: 18px; cursor: pointer;
      transition: transform 0.1s, box-shadow 0.1s;
    }
    .btn-primary {
      color: #fff;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      box-shadow:
        inset 2px 2px 6px rgba(255,255,255,0.5),
        inset -2px -2px 6px rgba(0,0,0,0.18),
        6px 6px 16px rgba(138,92,245,0.45);
    }
    .btn-secondary {
      color: var(--text); background: var(--clay);
      box-shadow:
        inset 2px 2px 6px var(--inner-light),
        inset -2px -2px 6px var(--inner-dark),
        6px 6px 14px rgba(140,145,195,0.3);
    }
    .btn:hover { transform: translateY(-2px); }
    .btn:active { transform: translateY(1px); box-shadow: inset 4px 4px 10px rgba(0,0,0,0.15); }

    .form-group { margin-bottom: 18px; }
    .form-label {
      display: flex; justify-content: space-between;
      font-size: 14px; font-weight: 700; color: var(--text); margin-bottom: 10px;
    }
    .form-label span { color: var(--accent); }

    input[type="range"] {
      -webkit-appearance: none; width: 100%; height: 14px;
      background: var(--clay); border-radius: 10px;
      box-shadow: inset 3px 3px 7px var(--inner-dark), inset -3px -3px 7px var(--inner-light);
      outline: none; cursor: pointer;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none; width: 22px; height: 22px; border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      box-shadow: 3px 3px 8px rgba(138,92,245,0.55), inset 1px 1px 3px rgba(255,255,255,0.4);
      border: none;
    }

    .checkbox-row {
      display: flex; align-items: center; gap: 14px; cursor: pointer;
      padding: 12px 16px; border-radius: 18px; background: var(--clay);
      box-shadow: inset 2px 2px 6px var(--inner-light), inset -2px -2px 6px var(--inner-dark);
      margin-bottom: 18px;
    }
    .checkbox-row input { position: absolute; opacity: 0; width: 1px; height: 1px; }
    .chk {
      width: 26px; height: 26px; border-radius: 10px; background: var(--clay);
      box-shadow:
        inset 2px 2px 5px var(--inner-dark),
        inset -2px -2px 5px var(--inner-light);
      position: relative; flex-shrink: 0;
      transition: background 0.2s, box-shadow 0.2s;
    }
    input[type="checkbox"]:focus-visible ~ .chk { outline: 2px solid #8a5cf5; outline-offset: 2px; }
    input[type="checkbox"]:checked ~ .chk {
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      box-shadow: 2px 2px 6px rgba(138,92,245,0.45), inset 1px 1px 2px rgba(255,255,255,0.3);
    }
    input[type="checkbox"]:checked ~ .chk::after {
      content: '✓'; position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 800;
    }
    .chk-label { font-size: 14px; font-weight: 600; }

    select, input[type="text"] {
      width: 100%; padding: 12px 16px;
      font-family: 'Baloo 2', sans-serif; font-size: 14px; font-weight: 600;
      color: var(--text);
      background: var(--clay); border: none; border-radius: 18px;
      box-shadow: inset 3px 3px 8px var(--inner-dark), inset -3px -3px 8px var(--inner-light);
      outline: none;
    }
    select:focus, input[type="text"]:focus {
      box-shadow: inset 3px 3px 8px var(--inner-dark), inset -3px -3px 8px var(--inner-light), 0 0 0 3px rgba(138,92,245,0.25);
    }
    input[type="text"]::placeholder { color: var(--text-soft); }

    .output {
      margin-top: 20px; padding: 14px 18px;
      background: var(--clay); border-radius: 18px;
      box-shadow: inset 3px 3px 8px var(--inner-dark), inset -3px -3px 8px var(--inner-light);
      font-size: 13px; color: var(--text-soft); font-weight: 600;
    }
    .output strong { color: var(--accent); }

    :focus-visible {
      outline: 2px solid #8a5cf5;
      outline-offset: 2px;
      border-radius: 6px;
    }
    ::selection { background: color-mix(in srgb, #8a5cf5 30%, transparent); color: inherit; }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.001ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.001ms !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>
<body>
  <div class="card">
    <h1><span>Claymorphism</span></h1>
    <div class="sub">Soft, squishy, three-dimensional</div>

    <div class="section-title">Actions</div>
    <div class="btn-row">
      <button class="btn btn-primary" id="apply">Apply</button>
      <button class="btn btn-secondary" id="reset">Reset</button>
    </div>

    <div class="form-group">
      <label class="form-label" for="softness">Softness <span id="v">68%</span></label>
      <input type="range" id="softness" min="0" max="100" value="68">
    </div>

    <label class="checkbox-row">
      <input type="checkbox" id="bounce">
      <span class="chk"></span>
      <span class="chk-label">Enable bounce animation</span>
    </label>

    <div class="form-group">
      <label class="form-label" for="palette">Palette</label>
      <select id="palette">
        <option>Lavender Bliss</option><option>Coral Dream</option>
        <option>Mint Cloud</option><option>Peach Bubble</option>
      </select>
    </div>

    <div class="form-group">
      <input type="text" id="creation-name" placeholder="Name your creation..." aria-label="Name your creation">
    </div>

    <div class="output" id="out" role="status" aria-live="polite"><strong>status</strong> — <span id="out-msg">ready to squish</span></div>
  </div>
  <script>
    (function () {
      const msg = document.getElementById('out-msg');
      const log = (m) => { msg.textContent = m; };

      document.getElementById('apply').addEventListener('click', () => log('Applied'));
      document.getElementById('reset').addEventListener('click', () => log('Reset'));

      const softness = document.getElementById('softness');
      const value = document.getElementById('v');
      softness.addEventListener('input', () => {
        value.textContent = softness.value + '%';
        log('Softness ' + softness.value + '%');
      });

      const bounce = document.getElementById('bounce');
      bounce.addEventListener('change', () => log('Bounce ' + bounce.checked));

      const palette = document.getElementById('palette');
      palette.addEventListener('change', () => log('Palette ' + palette.value));

      const creationName = document.getElementById('creation-name');
      creationName.addEventListener('input', () => log('Name ' + creationName.value));
    })();
  </script>
</body>
</html>
