<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Editorial Menu</title>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,700;1,6..72,400&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { color-scheme: light; }
    body {
      font-family: 'Newsreader', Georgia, 'Times New Roman', serif;
      font-size: 15px;
      min-height: 100dvh;
      padding: 40px 20px;
      display: flex; align-items: flex-start; justify-content: center;
      background: #faf7f0;
      color: #1a1814;
      accent-color: #c0392b;
    }

    .card {
      width: 440px;
      background: #faf7f0;
      padding: 36px 32px;
      border: 1px solid #1a1814;
    }

    .kicker {
      font-size: 11px; font-weight: 500;
      letter-spacing: 0.22em; text-transform: uppercase;
      color: #c0392b; margin-bottom: 10px;
    }
    h1 {
      font-size: 38px; font-weight: 700; line-height: 1.05;
      letter-spacing: -0.01em; margin-bottom: 8px;
    }
    .deck {
      font-style: italic; font-size: 16px; color: #4a453c;
      margin-bottom: 16px;
    }
    .masthead-rule {
      border-top: 1px solid #1a1814;
      border-bottom: 3px solid #1a1814;
      height: 6px;
      margin-bottom: 26px;
    }

    .section-label {
      font-size: 10px; font-weight: 500;
      letter-spacing: 0.22em; text-transform: uppercase;
      color: #c0392b; margin-bottom: 10px;
    }
    .rule-thin { border-top: 1px solid #c0392b; margin: 22px 0; }

    .btn-row { display: flex; gap: 12px; margin-bottom: 24px; }
    .btn {
      flex: 1; padding: 11px 16px;
      font-family: inherit; font-size: 13px; font-weight: 500;
      letter-spacing: 0.18em; text-transform: uppercase;
      cursor: pointer; border-radius: 0;
      transition: background 0.12s, color 0.12s;
    }
    .btn-primary { background: #1a1814; color: #faf7f0; border: 1px solid #1a1814; }
    .btn-primary:hover { background: #353026; }
    .btn-secondary { background: transparent; color: #1a1814; border: 1px solid #1a1814; }
    .btn-secondary:hover { background: #1a1814; color: #faf7f0; }

    .form-group { margin-bottom: 22px; }
    .form-label {
      display: flex; justify-content: space-between; align-items: baseline;
      font-size: 15px; margin-bottom: 8px;
    }
    .form-label .value { font-style: italic; color: #4a453c; }

    input[type="range"] {
      -webkit-appearance: none; appearance: none;
      width: 100%; height: 14px;
      background: transparent; cursor: pointer;
    }
    input[type="range"]::-webkit-slider-runnable-track { height: 1px; background: #1a1814; }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none; appearance: none;
      width: 11px; height: 11px; margin-top: -5px;
      background: #1a1814; border: none; border-radius: 0;
    }
    input[type="range"]::-moz-range-track { height: 1px; background: #1a1814; }
    input[type="range"]::-moz-range-thumb {
      width: 11px; height: 11px;
      background: #1a1814; border: none; border-radius: 0;
    }

    .checkbox-row {
      display: flex; align-items: center; gap: 12px;
      cursor: pointer; margin-bottom: 22px; position: relative;
    }
    .checkbox-row input { position: absolute; opacity: 0; width: 1px; height: 1px; }
    .box {
      width: 15px; height: 15px; flex-shrink: 0;
      border: 1px solid #1a1814; background: #faf7f0;
      position: relative;
    }
    input:checked ~ .box::after {
      content: ""; position: absolute; inset: 2px;
      background: #1a1814;
    }
    input:focus-visible ~ .box { outline: 2px solid #c0392b; outline-offset: 2px; }

    select, input[type="text"] {
      width: 100%; padding: 8px 0;
      font-family: inherit; font-size: 16px; color: #1a1814;
      background: transparent;
      border: none; border-bottom: 1px solid #1a1814;
      border-radius: 0;
    }
    select { padding: 8px 2px; cursor: pointer; }
    input[type="text"]::placeholder { font-style: italic; color: #8a8478; }
    select:focus, input[type="text"]:focus {
      outline: none; border-bottom: 2px solid #c0392b; margin-bottom: -1px;
    }

    .folio {
      margin-top: 28px; padding: 9px 0;
      border-top: 1px solid #1a1814; border-bottom: 1px solid #1a1814;
      display: flex; justify-content: space-between; gap: 16px;
      font-size: 12.5px; font-style: italic; color: #4a453c;
    }
    .folio .page { font-style: normal; white-space: nowrap; }

    :focus-visible { outline: 2px solid #c0392b; outline-offset: 2px; }
    ::selection { background: #1a1814; color: #faf7f0; }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.001ms !important;
        transition-duration: 0.001ms !important;
      }
    }
  </style>
</head>
<body>
  <div class="card">
    <p class="kicker">The Composition Desk · No. 24</p>
    <h1>Editorial Menu</h1>
    <p class="deck">A settings page typeset like a Sunday feature.</p>
    <div class="masthead-rule"></div>

    <p class="section-label">Press Room</p>
    <div class="btn-row">
      <button class="btn btn-primary" id="set-type" type="button">Set Type</button>
      <button class="btn btn-secondary" id="pull-proof" type="button">Pull Proof</button>
    </div>

    <div class="form-group">
      <label class="form-label" for="measure">
        <span>Column measure</span><span class="value" id="measure-value">22 picas</span>
      </label>
      <input type="range" id="measure" min="14" max="36" value="22">
    </div>

    <label class="checkbox-row">
      <input type="checkbox" id="dropcap" checked>
      <span class="box"></span>
      <span>Open with a three-line drop cap</span>
    </label>

    <div class="form-group">
      <label class="form-label" for="layout"><span>Page grid</span></label>
      <select id="layout">
        <option>Single column, generous margins</option>
        <option>Two columns with gutter rule</option>
        <option>Three-column news grid</option>
        <option>Full-bleed photo spread</option>
      </select>
    </div>

    <div class="form-group">
      <label class="form-label" for="headline"><span>Working headline</span></label>
      <input type="text" id="headline" placeholder="Dispatches from the back page">
    </div>

    <div class="folio">
      <span role="status" aria-live="polite" id="status">Awaiting copy from the desk.</span>
      <span class="page">p. 24 · Set in Newsreader</span>
    </div>
  </div>

  <script>
    (function () {
      var status = document.getElementById('status');
      function log(text) { status.textContent = text; }

      document.getElementById('set-type').addEventListener('click', function () {
        log('Type set; the forme is locked for press.');
      });
      document.getElementById('pull-proof').addEventListener('click', function () {
        log('Galley proof pulled for the copy desk.');
      });

      var measure = document.getElementById('measure');
      var measureValue = document.getElementById('measure-value');
      measure.addEventListener('input', function () {
        measureValue.textContent = measure.value + ' picas';
        log('Measure adjusted to ' + measure.value + ' picas.');
      });

      var dropcap = document.getElementById('dropcap');
      dropcap.addEventListener('change', function () {
        log(dropcap.checked ? 'Drop cap restored to the lede.' : 'Drop cap struck from the lede.');
      });

      var layout = document.getElementById('layout');
      layout.addEventListener('change', function () {
        log('Grid changed: ' + layout.value.toLowerCase() + '.');
      });

      var headline = document.getElementById('headline');
      headline.addEventListener('input', function () {
        log(headline.value ? 'Slugged: “' + headline.value + '”' : 'Headline cleared from the slug.');
      });
    })();
  </script>
</body>
</html>
