<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gruvbox Menu</title>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { color-scheme: dark; }
    :root {
      --bg: #282828; --bg1: #3c3836; --bg2: #504945;
      --fg: #ebdbb2; --muted: #a89984;
      --yellow: #d79921; --yellow-b: #fabd2f;
      --orange: #d65d2e; --orange-b: #fe8019;
      --red-b: #fb4934; --green: #98971a; --green-b: #b8bb26;
      --aqua-b: #8ec07c; --blue-b: #83a598;
    }
    body {
      font-family: "JetBrains Mono", monospace;
      font-size: 14px;
      min-height: 100dvh;
      padding: 40px 20px;
      display: flex; align-items: flex-start; justify-content: center;
      background: var(--bg); color: var(--fg);
      accent-color: var(--orange-b);
    }
    :focus-visible { outline: 2px solid var(--orange-b); outline-offset: 2px; }
    ::selection { background: var(--yellow); color: var(--bg); }

    .card {
      width: 430px; padding: 26px 28px;
      background: var(--bg1);
      border: 1px solid var(--bg2); border-radius: 2px;
    }

    h1 { font-size: 22px; font-weight: 700; color: var(--yellow-b); }
    h1 .punct { color: var(--muted); font-weight: 400; }
    .sub { font-size: 12px; color: var(--muted); margin: 6px 0 24px; }

    .comment { font-size: 12px; color: var(--muted); margin-bottom: 12px; }

    .btn-row { display: flex; gap: 10px; margin-bottom: 24px; }
    .btn {
      font-family: inherit; font-size: 13px; font-weight: 700;
      padding: 8px 18px; border-radius: 2px;
      border: 1px solid transparent; cursor: pointer;
      transition: background-color 0.1s, border-color 0.1s;
    }
    .btn-primary { background: var(--orange); color: var(--bg); }
    .btn-primary:hover { background: var(--orange-b); }
    .btn-secondary { background: transparent; color: var(--fg); border-color: var(--muted); }
    .btn-secondary:hover { background: var(--bg2); }

    .field { margin-bottom: 22px; }
    .field-label {
      display: flex; justify-content: space-between; align-items: baseline;
      font-size: 13px; margin-bottom: 8px;
    }
    .field-label .value { color: var(--aqua-b); font-size: 12px; }

    input[type="range"] {
      -webkit-appearance: none; appearance: none;
      width: 100%; height: 16px; background: transparent; cursor: pointer;
    }
    input[type="range"]::-webkit-slider-runnable-track {
      height: 4px; background: var(--bg2); border-radius: 2px;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none; appearance: none;
      width: 14px; height: 14px; margin-top: -5px;
      background: var(--yellow-b); border-radius: 2px;
    }
    input[type="range"]::-moz-range-track {
      height: 4px; background: var(--bg2); border-radius: 2px;
    }
    input[type="range"]::-moz-range-thumb {
      width: 14px; height: 14px;
      background: var(--yellow-b); border: none; border-radius: 2px;
    }

    .check {
      display: flex; align-items: center; gap: 10px;
      font-size: 13px; cursor: pointer; margin-bottom: 22px; position: relative;
    }
    .check input { position: absolute; opacity: 0; width: 1px; height: 1px; }
    .box {
      width: 16px; height: 16px; flex-shrink: 0;
      background: var(--bg); border: 1px solid var(--muted); border-radius: 2px;
      position: relative;
    }
    .check input:checked ~ .box { background: var(--green-b); border-color: var(--green-b); }
    .check input:checked ~ .box::after {
      content: ""; position: absolute; left: 4px; top: 1px;
      width: 5px; height: 9px;
      border: solid var(--bg); border-width: 0 2px 2px 0;
      transform: rotate(45deg);
    }
    .check input:focus-visible ~ .box { outline: 2px solid var(--orange-b); outline-offset: 2px; }

    select, input[type="text"] {
      width: 100%; font-family: inherit; font-size: 13px;
      padding: 8px 10px;
      background: var(--bg); color: var(--fg);
      border: 1px solid var(--bg2); border-radius: 2px;
      transition: border-color 0.1s;
    }
    select { cursor: pointer; }
    select:hover, input[type="text"]:hover { border-color: var(--muted); }
    select option { background: var(--bg); color: var(--fg); }
    input[type="text"]::placeholder { color: var(--muted); opacity: 0.7; }

    .statusline {
      display: flex; align-items: stretch; margin-top: 24px;
      border-radius: 2px; overflow: hidden; font-size: 12px;
    }
    .mode { background: var(--muted); color: var(--bg); font-weight: 700; padding: 6px 10px; }
    .msg { flex: 1; background: var(--bg2); color: var(--fg); padding: 6px 10px; min-width: 0; }
    .pos { background: var(--yellow); color: var(--bg); font-weight: 700; padding: 6px 10px; }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.001ms !important;
        transition-duration: 0.001ms !important;
      }
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>gruvbox<span class="punct">.vim</span></h1>
    <p class="sub">retro groove color scheme &mdash; dark, medium contrast</p>

    <div class="comment">-- actions</div>
    <div class="btn-row">
      <button type="button" class="btn btn-primary" id="btn-apply">:apply</button>
      <button type="button" class="btn btn-secondary" id="btn-reset">:reset</button>
    </div>

    <div class="comment">-- display</div>
    <div class="field">
      <div class="field-label">
        <label for="contrast">contrast</label>
        <span class="value" id="contrast-value">60%</span>
      </div>
      <input type="range" id="contrast" min="0" max="100" value="60" />
    </div>

    <label class="check">
      <input type="checkbox" id="italics" checked />
      <span class="box"></span>
      <span>italic = true</span>
    </label>

    <div class="comment">-- colorscheme</div>
    <div class="field">
      <div class="field-label"><label for="variant">variant</label></div>
      <select id="variant">
        <option>gruvbox-dark-hard</option>
        <option selected>gruvbox-dark-medium</option>
        <option>gruvbox-dark-soft</option>
        <option>gruvbox-material</option>
      </select>
    </div>

    <div class="field">
      <div class="field-label"><label for="config">config path</label></div>
      <input type="text" id="config" placeholder="~/.config/nvim/init.lua" />
    </div>

    <div class="statusline">
      <span class="mode">NORMAL</span>
      <span class="msg" id="status" role="status" aria-live="polite">ready</span>
      <span class="pos">1:1</span>
    </div>
  </div>

  <script>
    (function () {
      var status = document.getElementById("status");
      function report(message) { status.textContent = message; }

      document.getElementById("btn-apply").addEventListener("click", function () {
        report('"init.lua" written — settings applied');
      });
      document.getElementById("btn-reset").addEventListener("click", function () {
        report("defaults restored");
      });

      var contrast = document.getElementById("contrast");
      var contrastValue = document.getElementById("contrast-value");
      contrast.addEventListener("input", function () {
        contrastValue.textContent = contrast.value + "%";
        report("contrast = " + contrast.value + "%");
      });

      document.getElementById("italics").addEventListener("change", function (event) {
        report("italic = " + event.target.checked);
      });

      document.getElementById("variant").addEventListener("change", function (event) {
        report("colorscheme " + event.target.value);
      });

      document.getElementById("config").addEventListener("input", function (event) {
        report("config: " + (event.target.value || "~"));
      });
    })();
  </script>
</body>
</html>
