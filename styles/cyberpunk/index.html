<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cyberpunk Menu</title>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --cyan: #00fff5;
      --magenta: #ff00c8;
      --lime: #a8ff3e;
      --dark: #050510;
      --panel: #0a0a1a;
      --panel-border: #1a1a3a;
      --text: #c8d8e8;
      --dim: #4a5a7a;
    }
    body {
      font-family: 'Share Tech Mono', monospace;
      min-height: 100vh;
      background: var(--dark);
      padding: 40px 20px;
      display: flex;
      align-items: flex-start;
      justify-content: center;
    }
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(
        0deg, transparent, transparent 2px,
        rgba(0,255,245,0.015) 2px, rgba(0,255,245,0.015) 4px
      );
      pointer-events: none;
      z-index: 100;
    }
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(0,255,245,0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,255,245,0.04) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
    }

    .card {
      width: 420px;
      padding: 28px 24px;
      background: var(--panel);
      border: 1px solid var(--cyan);
      box-shadow: 0 0 20px rgba(0,255,245,0.15), inset 0 0 30px rgba(0,255,245,0.03);
      position: relative;
      z-index: 1;
      clip-path: polygon(0 0, calc(100% - 16px) 0, 100% 16px, 100% 100%, 16px 100%, 0 calc(100% - 16px));
    }
    .card::before, .card::after {
      content: '';
      position: absolute;
      width: 12px;
      height: 12px;
      border-color: var(--magenta);
      border-style: solid;
    }
    .card::before { top: 5px; left: 5px; border-width: 2px 0 0 2px; }
    .card::after  { bottom: 5px; right: 5px; border-width: 0 2px 2px 0; }

    .eyebrow {
      font-size: 10px;
      color: var(--dim);
      letter-spacing: 2px;
      margin-bottom: 4px;
    }
    h1 {
      font-family: 'Orbitron', sans-serif;
      font-size: 24px;
      font-weight: 700;
      color: var(--cyan);
      text-shadow: 0 0 12px rgba(0,255,245,0.5);
      margin-bottom: 4px;
    }
    .sub {
      font-size: 12px;
      color: var(--dim);
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--panel-border);
    }

    .section-title {
      font-family: 'Orbitron', sans-serif;
      font-size: 10px;
      letter-spacing: 3px;
      color: var(--magenta);
      text-transform: uppercase;
      margin-bottom: 12px;
    }

    .btn-row { display: flex; gap: 12px; margin-bottom: 20px; }
    .btn {
      flex: 1;
      padding: 11px;
      font-family: 'Orbitron', sans-serif;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      cursor: pointer;
      border: 1px solid;
      background: transparent;
      transition: box-shadow 0.15s;
    }
    .btn-primary {
      color: var(--cyan);
      border-color: var(--cyan);
      box-shadow: 0 0 12px rgba(0,255,245,0.25), inset 0 0 12px rgba(0,255,245,0.08);
    }
    .btn-primary:hover { box-shadow: 0 0 20px rgba(0,255,245,0.45); }
    .btn-secondary {
      color: var(--magenta);
      border-color: var(--magenta);
      box-shadow: 0 0 12px rgba(255,0,200,0.2);
    }
    .btn-secondary:hover { box-shadow: 0 0 20px rgba(255,0,200,0.35); }

    .form-group { margin-bottom: 18px; }
    .form-label {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: var(--text);
      margin-bottom: 8px;
    }
    .form-label .value { color: var(--lime); text-shadow: 0 0 6px rgba(168,255,62,0.4); }

    input[type="range"] {
      -webkit-appearance: none;
      width: 100%;
      height: 3px;
      background: var(--panel-border);
      outline: none;
      cursor: pointer;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 14px;
      height: 14px;
      background: var(--cyan);
      box-shadow: 0 0 8px var(--cyan);
    }

    .checkbox-row {
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      padding: 10px 0;
      margin-bottom: 16px;
      color: var(--text);
    }
    .checkbox-row input { display: none; }
    .chk {
      width: 16px;
      height: 16px;
      border: 1px solid var(--cyan);
      position: relative;
      flex-shrink: 0;
    }
    input[type="checkbox"]:checked ~ .chk {
      background: rgba(0,255,245,0.15);
      box-shadow: 0 0 8px rgba(0,255,245,0.4);
    }
    input[type="checkbox"]:checked ~ .chk::after {
      content: '×';
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--cyan);
      font-size: 14px;
      line-height: 1;
    }

    select, input[type="text"] {
      width: 100%;
      padding: 10px 12px;
      font-family: inherit;
      font-size: 13px;
      color: var(--text);
      background: rgba(0,255,245,0.04);
      border: 1px solid var(--panel-border);
      outline: none;
    }
    select option { background: var(--panel); }
    select:focus, input[type="text"]:focus {
      border-color: var(--cyan);
      box-shadow: 0 0 8px rgba(0,255,245,0.2);
    }
    input[type="text"]::placeholder { color: var(--dim); }

    .output {
      margin-top: 16px;
      padding: 12px;
      border: 1px solid var(--panel-border);
      font-size: 11px;
      color: var(--dim);
      min-height: 40px;
    }
    .output strong { color: var(--lime); }

    html { color-scheme: dark; }
    body { min-height: 100dvh; accent-color: var(--cyan); }
    :focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition-duration: 0.001ms !important; }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="eyebrow">SYS://NETRUNNER</div>
    <h1>CYBERPUNK</h1>
    <div class="sub">Neon interface · scanline grid</div>

    <div class="section-title">// Actions</div>
    <div class="btn-row">
      <button class="btn btn-primary" onclick="log('JACK IN')">Jack in</button>
      <button class="btn btn-secondary" onclick="log('ABORT')">Abort</button>
    </div>

    <div class="form-group">
      <div class="form-label">Signal <span class="value" id="v">84%</span></div>
      <input type="range" min="0" max="100" value="84"
        oninput="document.getElementById('v').textContent=this.value+'%';log('Signal '+this.value+'%')">
    </div>

    <label class="checkbox-row">
      <input type="checkbox" onchange="log('ICE breaker '+this.checked)">
      <span class="chk"></span>
      <span>ICE breaker active</span>
    </label>

    <div class="form-group">
      <div class="form-label">Deck profile</div>
      <select onchange="log('Profile '+this.value)">
        <option>Street Samurai</option>
        <option>Netrunner</option>
        <option>Corpo</option>
        <option>Nomad</option>
      </select>
    </div>

    <div class="form-group">
      <input type="text" placeholder="Handle…" oninput="log('Handle '+this.value)">
    </div>

    <div class="output" id="out"><strong>LINK</strong> — standby</div>
  </div>
  <script>function log(m){document.getElementById('out').innerHTML='<strong>LINK</strong> — '+m;}</script>
</body>
</html>
