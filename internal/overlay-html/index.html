<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>In-App Overlay Menu</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      overflow: hidden;
      background: #0b0f1a;
    }

    .scene {
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse at 30% 60%, #0d2b45 0%, transparent 55%),
        radial-gradient(ellipse at 75% 30%, #1a0d2e 0%, transparent 55%),
        linear-gradient(180deg, #0b0f1a 0%, #111827 100%);
    }
    .scene::before {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 35%;
      background: linear-gradient(180deg, transparent, #0d1b2a 60%, #091018 100%);
    }

    .hud { position: fixed; inset: 0; pointer-events: none; }
    .hud-bar { position: absolute; bottom: 28px; left: 28px; display: flex; gap: 16px; }
    .hud-stat {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: rgba(255,255,255,0.25);
    }
    .hud-val { color: rgba(99,179,237,0.5); }
    .hud-crosshair {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 20px;
      height: 20px;
      opacity: 0.2;
    }
    .hud-crosshair::before, .hud-crosshair::after {
      content: '';
      position: absolute;
      background: rgba(99,179,237,0.6);
    }
    .hud-crosshair::before { width: 1px; height: 100%; left: 50%; }
    .hud-crosshair::after  { height: 1px; width: 100%; top: 50%; }

    .toggle-btn {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 200;
      padding: 9px 18px;
      border-radius: 8px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.15);
      color: rgba(255,255,255,0.8);
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      backdrop-filter: blur(12px);
    }
    .toggle-btn:hover { background: rgba(255,255,255,0.14); }
    .toggle-btn kbd {
      display: inline-block;
      padding: 1px 6px;
      border-radius: 4px;
      background: rgba(255,255,255,0.12);
      font-family: inherit;
      font-size: 11px;
      margin-left: 6px;
      border: 1px solid rgba(255,255,255,0.15);
    }

    .overlay-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.45);
      backdrop-filter: blur(2px);
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
    }
    .overlay-backdrop.visible { opacity: 1; pointer-events: auto; }

    .overlay-panel {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, calc(-50% + 16px));
      z-index: 110;
      width: 420px;
      max-height: 85vh;
      background: rgba(14,18,32,0.95);
      border: 1px solid rgba(99,179,237,0.25);
      border-radius: 16px;
      box-shadow: 0 24px 64px rgba(0,0,0,0.7);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s, transform 0.2s;
      display: flex;
      flex-direction: column;
    }
    .overlay-panel.visible {
      opacity: 1;
      pointer-events: auto;
      transform: translate(-50%, -50%);
    }

    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 20px 16px;
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }
    .panel-header h2 { font-size: 18px; font-weight: 700; color: #fff; }
    .panel-header .eyebrow {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: rgba(99,179,237,0.6);
      margin-bottom: 2px;
    }
    .close-btn {
      width: 30px;
      height: 30px;
      border-radius: 8px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1);
      color: rgba(255,255,255,0.5);
      font-size: 16px;
      cursor: pointer;
    }
    .close-btn:hover { background: rgba(255,255,255,0.12); color: #fff; }

    .panel-body { padding: 20px; overflow-y: auto; }

    .section-title {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: rgba(255,255,255,0.4);
      margin-bottom: 12px;
    }

    .btn-row { display: flex; gap: 10px; margin-bottom: 20px; }
    .btn {
      flex: 1;
      padding: 10px;
      border-radius: 8px;
      border: none;
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-primary { background: #3b82f6; color: #fff; }
    .btn-primary:hover { background: #2563eb; }
    .btn-secondary {
      background: rgba(255,255,255,0.08);
      color: rgba(255,255,255,0.85);
      border: 1px solid rgba(255,255,255,0.12);
    }

    .form-group { margin-bottom: 18px; }
    .form-label {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      color: rgba(255,255,255,0.75);
      margin-bottom: 8px;
    }
    .form-label .value { color: #63b3ed; font-variant-numeric: tabular-nums; }

    input[type="range"] {
      -webkit-appearance: none;
      width: 100%;
      height: 4px;
      border-radius: 2px;
      background: rgba(255,255,255,0.12);
      outline: none;
      cursor: pointer;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #63b3ed;
      border: 2px solid #0e1220;
    }

    .checkbox-row {
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      margin-bottom: 16px;
      color: rgba(255,255,255,0.85);
      font-size: 14px;
    }
    .checkbox-row input { display: none; }
    .chk {
      width: 18px;
      height: 18px;
      border-radius: 4px;
      border: 1.5px solid rgba(255,255,255,0.25);
      background: rgba(255,255,255,0.04);
      position: relative;
      flex-shrink: 0;
    }
    input[type="checkbox"]:checked ~ .chk { background: #3b82f6; border-color: #3b82f6; }
    input[type="checkbox"]:checked ~ .chk::after {
      content: '';
      position: absolute;
      left: 5px;
      top: 2px;
      width: 5px;
      height: 9px;
      border: solid #fff;
      border-width: 0 2px 2px 0;
      transform: rotate(45deg);
    }

    select, input[type="text"] {
      width: 100%;
      padding: 10px 12px;
      font-family: inherit;
      font-size: 14px;
      color: #fff;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 8px;
      outline: none;
    }
    select option { background: #0e1220; }
    input[type="text"]::placeholder { color: rgba(255,255,255,0.35); }

    .panel-output {
      margin-top: 4px;
      padding: 10px 12px;
      border-radius: 8px;
      background: rgba(0,0,0,0.3);
      font-size: 12px;
      color: rgba(255,255,255,0.5);
      min-height: 36px;
    }
    .panel-output strong { color: #63b3ed; }

    html { color-scheme: dark; }
    :focus-visible { outline: 2px solid #63b3ed; outline-offset: 2px; }
    @media (prefers-reduced-motion: reduce) {
      .overlay-backdrop, .overlay-panel { transition: none; }
    }
  </style>
</head>
<body>
  <div class="scene"></div>

  <div class="hud">
    <div class="hud-crosshair"></div>
    <div class="hud-bar">
      <div class="hud-stat">FPS <span class="hud-val">60</span></div>
      <div class="hud-stat">LAT <span class="hud-val">12ms</span></div>
    </div>
  </div>

  <button class="toggle-btn" onclick="openPanel()">Settings <kbd>O</kbd></button>

  <div class="overlay-backdrop" id="backdrop" onclick="closePanel()"></div>

  <div class="overlay-panel" id="panel" role="dialog" aria-modal="true" aria-labelledby="panelTitle">
    <div class="panel-header">
      <div>
        <div class="eyebrow">In-app overlay</div>
        <h2 id="panelTitle">Scene settings</h2>
      </div>
      <button class="close-btn" onclick="closePanel()" aria-label="Close">✕</button>
    </div>

    <div class="panel-body">
      <div class="section-title">Actions</div>
      <div class="btn-row">
        <button class="btn btn-primary" onclick="log('Apply')">Apply</button>
        <button class="btn btn-secondary" onclick="log('Reset')">Reset</button>
      </div>

      <div class="form-group">
        <div class="form-label">Exposure <span class="value" id="v">68%</span></div>
        <input type="range" min="0" max="100" value="68"
          oninput="document.getElementById('v').textContent=this.value+'%';log('Exposure '+this.value+'%')">
      </div>

      <label class="checkbox-row">
        <input type="checkbox" checked onchange="log('Vignette '+this.checked)">
        <span class="chk"></span>
        <span>Vignette</span>
      </label>

      <div class="form-group">
        <div class="form-label">Quality preset</div>
        <select onchange="log('Quality '+this.value)">
          <option>Ultra</option>
          <option>High</option>
          <option>Medium</option>
          <option>Low</option>
        </select>
      </div>

      <div class="form-group">
        <input type="text" placeholder="Save slot name…" oninput="log('Slot '+this.value)">
      </div>

      <div class="panel-output" id="out"><strong>Ready</strong> — scene running</div>
    </div>
  </div>

  <script>
    const panel = document.getElementById('panel');
    const backdrop = document.getElementById('backdrop');

    function openPanel() {
      panel.classList.add('visible');
      backdrop.classList.add('visible');
    }
    function closePanel() {
      panel.classList.remove('visible');
      backdrop.classList.remove('visible');
    }
    function log(m) {
      document.getElementById('out').innerHTML = '<strong>' + m + '</strong>';
    }

    document.addEventListener('keydown', e => {
      if (e.key === 'o' || e.key === 'O') openPanel();
      if (e.key === 'Escape') closePanel();
    });

    openPanel();
  </script>
</body>
</html>
